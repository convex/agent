name: Release Playground

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "40-character playground version-bump commit SHA on main"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: "24.22.1"

jobs:
  plan:
    if: github.repository_owner == 'convex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.select.outputs.version }}
      channel: ${{ steps.select.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: select
        name: Select a playground version-bump commit on main
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a 40-character commit SHA' >&2; exit 1; }
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"
          version=$(git show "$RELEASE_COMMIT:playground/package.json" | jq -r .version)
          previous=$(git show "$RELEASE_COMMIT^1:playground/package.json" | jq -r .version)
          locked=$(git show "$RELEASE_COMMIT:package-lock.json" | jq -r '.packages.playground.version')
          [[ "$version" == "$locked" ]] || { echo 'Playground version and lockfile differ' >&2; exit 1; }
          agent_version=$(git show "$RELEASE_COMMIT:package.json" | jq -r .version)
          agent_tag="v$agent_version"
          git show-ref --verify --quiet "refs/tags/$agent_tag" || { echo "Release Agent $agent_version first" >&2; exit 1; }
          git diff --quiet "$agent_tag" "$RELEASE_COMMIT" -- package.json src || {
            echo 'Agent package changes since its last release; release Agent first' >&2
            exit 1
          }
          [[ "$(npm view "@convex-dev/agent@$agent_version" version)" == "$agent_version" ]] || {
            echo "Approve the staged Agent $agent_version release before releasing Playground" >&2
            exit 1
          }
          VERSION="$version" PREVIOUS_VERSION="$previous" node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          const npmRoot = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
          const semver = createRequire(`${npmRoot}/npm/package.json`)('semver');
          const { VERSION: version, PREVIOUS_VERSION: previous } = process.env;
          if (semver.valid(version) !== version || !semver.gt(version, previous)) throw new Error('Selected commit must increase the playground version');
          const pre = semver.prerelease(version);
          const channel = pre ? String(pre[0]) : 'latest';
          if (pre && (!/^[a-z][a-z0-9-]*$/.test(channel) || channel === 'latest' || semver.validRange(channel))) throw new Error('Invalid prerelease channel');
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
          NODE
          tag="playground/v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "$tag already exists; inspect the staged package before retrying" >&2
            exit 1
          fi
          {
            echo "sha=$RELEASE_COMMIT"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Verify the bundled Agent matches the published build
        run: |
          agent_version=$(jq -r .version package.json)
          published_dir=$(mktemp -d)
          npm pack "@convex-dev/agent@$agent_version" --ignore-scripts --pack-destination "$published_dir"
          tar -xzf "$published_dir"/*.tgz -C "$published_dir" package/dist
          diff -r "$published_dir/package/dist" dist || {
            echo 'Agent build differs from the published release; release Agent first' >&2
            exit 1
          }
      - run: npm run check
      - run: npm run build -w playground
      - run: npm run lint -w playground
      - name: Run E2E tests and verify generated code
        env:
          CONVEX_AGENT_MODE: anonymous
          CONVEX_DISABLE_TELEMETRY: "1"
        run: |
          npm run test:e2e
          git diff --exit-code -- src/component/_generated
          test -z "$(git ls-files --others --exclude-standard src/component/_generated)"
      - name: Pack the tested playground
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          cd playground
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP"/npm-release/*.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playground-release-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error

  stage:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Stage the tested playground
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -o pipefail
          set -- "$RUNNER_TEMP"/npm-release/*.tgz
          test "$#" -eq 1
          TARBALL="$1"
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum -c -
          {
            echo "@convex-dev/agent-playground@$VERSION — source $SOURCE_SHA — npm channel $CHANNEL"
            echo "Review on npm's Staged Packages page, then approve with 2FA or npm stage approve <stage-id>."
          } >> "$GITHUB_STEP_SUMMARY"
          GITHUB_SHA="$SOURCE_SHA" npm stage publish "$TARBALL" \
            --ignore-scripts --provenance --access public --tag "$CHANNEL" \
            2>&1 | tee "$RUNNER_TEMP/npm-stage.log"
      - name: Preserve staging output and stage ID
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/npm-stage.log"; then
            cat "$RUNNER_TEMP/npm-stage.log" >> "$GITHUB_STEP_SUMMARY"
          fi

  tag:
    needs: [plan, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the staged source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="playground/v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$SOURCE_SHA"
          else
            git tag "$tag" "$SOURCE_SHA"
            gh auth setup-git
            git push origin "refs/tags/$tag"
          fi
