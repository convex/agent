name: Update release PR

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Update release PR
    if: github.repository_owner == 'convex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check whether a version PR is needed
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Check main is still at this run's commit
        if: steps.mode.outputs.mode == 'version'
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release PR update: main has moved beyond this run's commit."
          fi
      - name: Create or update the release PR
        id: version
        if:
          steps.mode.outputs.mode == 'version' &&
          steps.freshness.outputs.current == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          script: npm run version:ci
          pr-title: "Prepare next release"
          commit-message: "Version packages"
          pr-base-branch: main
      - name: Describe staged publishing in the release PR
        if: steps.version.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs['pr-number'] }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const route = `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`;
          const pr = JSON.parse(
            execFileSync("gh", ["api", route], { encoding: "utf8" }),
          );
          const marker = "# Releases\n";
          const index = pr.body.indexOf(marker);
          if (index < 0) throw new Error("Changesets release notes are missing");
          const intro = [
            "This PR was opened by the Changesets version workflow.",
            "",
            "Merging it stages the tested package on npm through trusted publishing.",
            "Review and approve the staged package separately with 2FA.",
            "Additional changesets merged into main will update this PR.",
            "",
            "",
          ].join("\n");
          const body = intro + pr.body.slice(index);
          if (body !== pr.body) {
            execFileSync("gh", ["api", "-X", "PATCH", route, "--input", "-"], {
              input: JSON.stringify({ body }),
            });
          }
          NODE
